services:
  btc-outlook:
    build: .
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    environment:
      BTC_DATABASE_PATH: /data/btc_outlook.sqlite3
      DEEP_SEEK_API_KEY: ${DEEP_SEEK_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TZ: America/New_York
    volumes:
      - btc-outlook-data:/data
    restart: unless-stopped

volumes:
  btc-outlook-data:
